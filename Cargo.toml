[workspace]
resolver = "3"
members = [
    "crates/ghosttrace-core",
    "crates/ghosttrace-cli",
    "crates/ghosttrace-desktop",
    "xtask",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
rust-version = "1.99.1"

# Shared dependency versions from plan Section 3. Features stay minimal;
# add features only when a task requires them (P0.1 verifies this resolves).
[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "time"] }
clap = { version = "4.6.7", features = ["derive"] }
tracing = "0.1.44"
eframe = "0.37.0"
egui = "0.37.0"
toml = "0.9.6"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10.4"

[profile.release]
# Evidence work is I/O bound; keep defaults for now, measure in P10.
