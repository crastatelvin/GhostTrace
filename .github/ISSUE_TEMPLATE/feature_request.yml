name: Feature request
description: Propose an investigation workflow improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Check `docs/plans/2026-10-23-ghosttrace-master-plan.md` Section 2 first:
        some capabilities (raw disk images, cloud sync, plugins) are explicitly
        out of scope for 1.0 and will be closed as planned omissions.
  - type: textarea
    id: problem
    attributes:
      label: Investigation problem
      description: What are you trying to determine that the tool cannot support today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Including how evidence and uncertainty should be presented.
    validations:
      required: true
  - type: textarea
    id: format
    attributes:
      label: Artifact formats involved
      description: Include versions/schemas if an input format is involved.
    validations:
      required: false
