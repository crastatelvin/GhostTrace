name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Public PRs get no secrets and no privileged permissions (plan Section 20).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: checks (fmt, clippy, tests, features, fixtures, policy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # The documented check battery, identical to `cargo run -p xtask -- check`
      # (plan Section 16). Rust toolchain comes from rust-toolchain.toml, so no
      # default-toolchain override is needed.
      - name: xtask check
        run: cargo run -p xtask -- check
